<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Proverbe du Jour</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(15, 23, 42, 0.75);
            --accent-gold: #f59e0b;
            --accent-green: #34d399;
            --text-light: #f8fafc;
            --text-dim: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background-image 0.8s ease-in-out;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(8px);
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 500px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: var(--accent-gold);
            font-size: 2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-top: 4px;
            text-shadow: 0 1px 5px rgba(0,0,0,0.8);
        }

        /* Barre de recherche */
        .search-container {
            position: relative;
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(15, 23, 42, 0.85);
            color: var(--text-light);
            font-size: 0.9rem;
            outline: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.3);
        }

        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #1e293b;
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 12px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 100;
            margin-top: 5px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            display: none;
        }

        .search-item {
            padding: 12px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            font-size: 0.85rem;
            text-align: left;
        }

        .search-item:hover {
            background: rgba(245, 158, 11, 0.2);
            color: var(--accent-gold);
        }

        /* Carte principale */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 30px 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            text-align: center;
            position: relative;
        }

        .badge-group {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .date-badge {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-gold);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .theme-badge {
            background: rgba(52, 211, 153, 0.15);
            color: var(--accent-green);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(52, 211, 153, 0.3);
        }

        .proverb-text {
            font-family: 'Cinzel', serif;
            font-size: 1.35rem;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .info-box {
            font-size: 0.9rem;
            color: var(--text-dim);
            line-height: 1.5;
            background: rgba(15, 23, 42, 0.65);
            padding: 15px;
            border-radius: 12px;
            text-align: left;
            margin-bottom: 14px;
        }

        .explanation {
            border-left: 3px solid var(--accent-gold);
        }

        .positive-thought {
            border-left: 3px solid var(--accent-green);
            margin-bottom: 24px;
        }

        .info-box strong {
            display: block;
            margin-bottom: 4px;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .explanation strong {
            color: var(--accent-gold);
        }

        .positive-thought strong {
            color: var(--accent-green);
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        button {
            flex: 1 1 calc(50% - 5px);
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-light);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        button:hover {
            background: var(--accent-gold);
            color: #000;
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            margin-top: 20px;
            color: var(--text-dim);
            font-size: 0.75rem;
        }

        /* Carte cachée pour le téléchargement d'image HD */
        #hiddenCard {
            position: absolute;
            left: -9999px;
            top: -9999px;
            width: 800px;
            padding: 60px 50px;
            background-size: cover;
            background-position: center;
            border-radius: 0px;
            color: #fff;
            box-sizing: border-box;
        }

        .hidden-overlay {
            background: rgba(15, 23, 42, 0.85);
            padding: 50px;
            border-radius: 24px;
            border: 2px solid rgba(245, 158, 11, 0.4);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Le Proverbe du Jour</h1>
            <p class="subtitle">Sagesse & Pensées au quotidien</p>
        </header>

        <!-- Recherche -->
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Rechercher un proverbe, thème..." onkeyup="searchProverb()">
            <div id="searchResults" class="search-results"></div>
        </div>

        <!-- Carte principale -->
        <div class="card">
            <div class="badge-group">
                <span class="date-badge" id="date">--</span>
                <span class="theme-badge" id="theme">--</span>
            </div>
            <div class="proverb-text" id="proverb">Chargement...</div>
            
            <div class="info-box explanation">
                <strong>Explication</strong>
                <span id="explanation">...</span>
            </div>

            <div class="info-box positive-thought">
                <strong>🌱 Pensée Positive</strong>
                <span id="thought">...</span>
            </div>

            <div class="btn-group">
                <button onclick="speakProverb()">🔊 Écouter</button>
                <button onclick="shareProverb()">📲 Partager</button>
                <button onclick="downloadImage()">🖼️ Image HD</button>
                <button onclick="getRandomProverb()">🎲 Un autre</button>
            </div>
        </div>

        <footer>
            Proverbe du Jour • 100 Proverbes & Inspirations
        </footer>
    </div>

    <!-- Element masqué servant à générer la carte image haute définition -->
    <div id="hiddenCard">
        <div class="hidden-overlay">
            <div style="color: #f59e0b; font-size: 1.2rem; font-weight: 600; text-transform: uppercase; margin-bottom: 10px;" id="hiddenTheme">THÈME</div>
            <div style="font-family: 'Cinzel', serif; font-size: 2.2rem; line-height: 1.5; margin-bottom: 30px; color: #ffffff;" id="hiddenProverb">« »</div>
            <div style="background: rgba(15, 23, 42, 0.7); padding: 20px; border-radius: 16px; border-left: 4px solid #f59e0b; margin-bottom: 20px; text-align: left; font-size: 1.1rem; color: #e2e8f0;">
                <strong style="color: #f59e0b; display: block; margin-bottom: 6px; font-size: 0.9rem;">EXPLICATION</strong>
                <span id="hiddenExp"></span>
            </div>
            <div style="background: rgba(15, 23, 42, 0.7); padding: 20px; border-radius: 16px; border-left: 4px solid #34d399; text-align: left; font-size: 1.1rem; color: #e2e8f0;">
                <strong style="color: #34d399; display: block; margin-bottom: 6px; font-size: 0.9rem;">🌱 PENSÉE POSITIVE</strong>
                <span id="hiddenThought"></span>
            </div>
            <div style="margin-top: 30px; font-size: 0.9rem; color: #94a3b8; font-style: italic;">Le Proverbe du Jour</div>
        </div>
    </div>

    <script>
        const proverbs = [
            { id: 1, theme: "Apparence", img: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80", text: "L'habit ne fait pas le moine.", exp: "Il ne faut pas juger une personne sur son apparence extérieure.", thought: "Aujourd'hui, je prends le temps de découvrir la richesse intérieure des gens qui m'entourent." },
            { id: 2, theme: "Patience", img: "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1200&q=80", text: "Qui va lentement arrive sûrement.", exp: "Prendre son temps garantit de mieux réussir ses entreprises.", thought: "Je respire et j'avance à mon propre rythme. Chaque petit pas me rapproche de mon objectif." },
            { id: 3, theme: "Espoir", img: "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1200&q=80", text: "Après la pluie, le beau temps.", exp: "Les difficultés finissent toujours par laisser place à des jours meilleurs.", thought: "Peu importe les nuages d'aujourd'hui, le soleil finit toujours par briller à nouveau." },
            { id: 4, theme: "Constance", img: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1200&q=80", text: "Pierre qui roule n'amasse pas mousse.", exp: "Changer trop souvent d'occupation ne permet pas de construire quelque chose de durable.", thought: "Je choisis un objectif important aujourd'hui et j'y consacre toute mon attention." },
            { id: 5, theme: "Authenticité", img: "https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80", text: "Chassez le naturel, il revient au galop.", exp: "On ne peut pas masquer sa vraie nature bien longtemps.", thought: "J'embrasse pleinement qui je suis aujourd'hui sans chercher à jouer un rôle." },
            { id: 6, theme: "Préparation", img: "https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=1200&q=80", text: "Rien ne sert de courir, il faut partir à point.", exp: "La précipitation est inutile, la préparation compte davantage.", thought: "Je prends un moment pour planifier ma journée dans le calme et la sérénité." },
            { id: 7, theme: "Persévérance", img: "https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1200&q=80", text: "Petit à petit, l'oiseau fait son nid.", exp: "C'est avec de la persévérance que l'on accomplit de grandes choses.", thought: "Je célèbre chaque petite victoire quotidienne, elles construisent mes grands succès." },
            { id: 8, theme: "Liberté", img: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80", text: "Quand le chat n'est pas là, les souris dansent.", exp: "En l'absence d'autorité, chacun profite pour agir à sa guise.", thought: "J'utilise ma liberté pour faire des choix qui me font du bien et me grandissent." },
            { id: 9, theme: "Volonté", img: "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1200&q=80", text: "Vouloir, c'est pouvoir.", exp: "La volonté permet de surmonter la plupart des obstacles.", thought: "J'ai en moi toute la force et la détermination nécessaires pour concrétiser mes rêves." },
            { id: 10, theme: "Talent", img: "https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=1200&q=80", text: "Aux âmes bien nées, la valeur n'attend point le nombre des années.", exp: "Le talent ne dépend pas de l'âge.", thought: "Mon potentiel est immense, quel que soit mon âge ou mon expérience passée." }
        ];

        let currentProverb = null;

        function getProverbOfDay() {
            const today = new Date();
            const start = new Date(today.getFullYear(), 0, 0);
            const diff = today - start;
            const oneDay = 1000 * 60 * 60 * 24;
            const dayOfYear = Math.floor(diff / oneDay);
            return proverbs[dayOfYear % proverbs.length];
        }

        function displayProverb(p) {
            currentProverb = p;
            
            // Mise à jour de l'image de fond du body
            const bgUrl = p.img || "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1200&q=80";
            document.body.style.backgroundImage = `url('${bgUrl}')`;

            document.getElementById('proverb').textContent = "« " + p.text + " »";
            document.getElementById('explanation').textContent = p.exp;
            document.getElementById('thought').textContent = p.thought;
            document.getElementById('theme').textContent = p.theme;
            
            const options = { weekday: 'long', day: 'numeric', month: 'long' };
            document.getElementById('date').textContent = new Date().toLocaleDateString('fr-FR', options);
        }

        function getRandomProverb() {
            const randomIndex = Math.floor(Math.random() * proverbs.length);
            displayProverb(proverbs[randomIndex]);
        }

        function speakProverb() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const textToSpeak = currentProverb.text + ". " + currentProverb.exp + " Pensée positive : " + currentProverb.thought;
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = 'fr-FR';
                window.speechSynthesis.speak(utterance);
            } else {
                alert('La synthèse vocale n\'est pas supportée sur cet appareil.');
            }
        }

        function shareProverb() {
            const textToShare = "« " + currentProverb.text + " »\n\nExplication : " + currentProverb.exp + "\n\nPensée positive : " + currentProverb.thought;
            if (navigator.share) {
                navigator.share({ title: 'Proverbe du Jour', text: textToShare, url: window.location.href });
            } else {
                navigator.clipboard.writeText(textToShare);
                alert('Proverbe copié dans le presse-papier !');
            }
        }

        function downloadImage() {
            const hiddenCard = document.getElementById('hiddenCard');
            
            // Prépa de la carte masquée
            document.getElementById('hiddenTheme').textContent = currentProverb.theme;
            document.getElementById('hiddenProverb').textContent = "« " + currentProverb.text + " »";
            document.getElementById('hiddenExp').textContent = currentProverb.exp;
            document.getElementById('hiddenThought').textContent = currentProverb.thought;
            hiddenCard.style.backgroundImage = `url('${currentProverb.img}')`;

            // Rendu en image
            html2canvas(hiddenCard, {
                useCORS: true,
                scale: 2
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `proverbe-${currentProverb.theme.toLowerCase()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        function searchProverb() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const resultsContainer = document.getElementById('searchResults');
            resultsContainer.innerHTML = '';

            if (input.trim() === '') {
                resultsContainer.style.display = 'none';
                return;
            }

            const filtered = proverbs.filter(p => 
                p.text.toLowerCase().includes(input) || 
                p.exp.toLowerCase().includes(input) || 
                p.theme.toLowerCase().includes(input)
            );

            if (filtered.length === 0) {
                resultsContainer.style.display = 'none';
                return;
            }

            filtered.slice(0, 5).forEach(p => {
                const item = document.createElement('div');
                item.className = 'search-item';
                item.innerHTML = `<strong>[${p.theme}]</strong> ${p.text}`;
                item.onclick = () => {
                    displayProverb(p);
                    resultsContainer.style.display = 'none';
                    document.getElementById('searchInput').value = '';
                };
                resultsContainer.appendChild(item);
            });

            resultsContainer.style.display = 'block';
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.search-container')) {
                document.getElementById('searchResults').style.display = 'none';
            }
        });

        window.onload = function() {
            displayProverb(getProverbOfDay());
        };
    </script>
</body>
</html>
