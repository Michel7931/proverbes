<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Proverbe du Jour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary: #f59e0b;
      --primary-hover: #d97706;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1e1b4b, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      width: 100%;
      margin-top: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.2rem;
      color: var(--primary);
      margin-bottom: 5px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      margin-bottom: 20px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .badge {
      background: rgba(245, 158, 11, 0.15);
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .date-text {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .proverb-text {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      line-height: 1.4;
      color: var(--text);
      margin-bottom: 20px;
      text-align: center;
    }

    .explanation-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--primary);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .explanation-text {
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text-muted);
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
      border: 1px solid var(--card-border);
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-primary {
      background: var(--primary);
      color: #000;
      border: none;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    footer {
      margin-top: auto;
      padding: 20px 0;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Le Proverbe du Jour</h1>
      <p>Une sagesse quotidienne à méditer</p>
    </header>

    <div class="card">
      <div class="card-header">
        <span class="badge" id="theme-badge">Sagesse</span>
        <span class="date-text" id="date-text"></span>
      </div>

      <div class="proverb-text" id="proverb-text">
        Chargement du proverbe...
      </div>

      <div class="explanation-title">Explication</div>
      <div class="explanation-text" id="explanation-text">
        ...
      </div>

      <div class="actions">
        <button class="btn btn-primary" onclick="randomProverb()">
          <i data-lucide="shuffle"></i> Un autre
        </button>
        <button class="btn" onclick="shareProverb()">
          <i data-lucide="share-2"></i> Partager
        </button>
      </div>
    </div>
  </div>

  <footer>
    <p>Mis à jour quotidiennement</p>
  </footer>

  <script>
    const proverbs = [
      { text: "L'habit ne fait pas le moine.", exp: "Il ne faut pas juger une personne sur son apparence extérieure.", theme: "Apparence" },
      { text: "Qui va lentement arrive sûrement.", exp: "Prendre son temps garantit de mieux réussir ses entreprises.", theme: "Patience" },
      { text: "Après la pluie, le beau temps.", exp: "Les difficultés finissent toujours par passer.", theme: "Espoir" },
      { text: "Pierre qui roule n'amasse pas mousse.", exp: "Changer trop souvent d'occupation ne permet pas de construire quelque chose de durable.", theme: "Constance" },
      { text: "Chassez le naturel, il revient au galop.", exp: "On ne peut pas masquer sa vraie nature très longtemps.", theme: "Vérité" },
      { text: "Rien ne sert de courir, il faut partir à point.", exp: "La précipitation ne remplace pas une bonne préparation.", theme: "Prudence" },
      { text: "Petit à petit, l'oiseau fait son nid.", exp: "C'est par la persévérance qu'on accomplit de grandes choses.", theme: "Persévérance" },
      { text: "Quand le chat n'est pas là, les souris dansent.", exp: "En l'absence d'autorité, chacun fait ce qui lui plaît.", theme: "Liberté" },
      { text: "Vouloir, c'est pouvoir.", exp: "La volonté permet de surmonter la plupart des obstacles.", theme: "Volonté" },
      { text: "Aux âmes bien nées, la valeur n'attend point le nombre des années.", exp: "Le talent et la maturité ne dépendent pas nécessairement de l'âge.", theme: "Maturité" },
      { text: "Goutte à goutte, l'eau creuse la pierre.", exp: "Avec de la patience et de la régularité, on surmonte de très grands obstacles.", theme: "Patience" },
      { text: "Les paroles s'envolent, les écrits restent.", exp: "Un engagement écrit a une valeur durable par rapport à une promesse orale.", theme: "Prudence" },
      { text: "On ne prête qu'aux riches.", exp: "On accorde plus facilement sa confiance ou ses faveurs à ceux qui ont déjà du succès.", theme: "Société" },
      { text: "Il n'y a pas de fumée sans feu.", exp: "Toute rumeur a souvent une part de vérité à son origine.", theme: "Vérité" },
      { text: "À cœur vaillant rien d'impossible.", exp: "Avec du courage, on peut réussir n'importe quel défi.", theme: "Courage" },
      { text: "Autant en emporte le vent.", exp: "Se dit des promesses ou des paroles qui sont rapidement oubliées.", theme: "Réalité" },
      { text: "Qui sème le vent récolte la tempête.", exp: "Provoquer des désordres finit par se retourner violemment contre soi.", theme: "Justice" },
      { text: "L'erreur est humaine, persévérer est diabolique.", exp: "Tout le monde peut se tromper, mais refuser de corriger ses fautes est impardonnable.", theme: "Sagesse" },
      { text: "Mieux vaut tard que jamais.", exp: "Il vaut mieux accomplir une action tardivement que de ne jamais la faire.", theme: "Temps" },
      { text: "L'union fait la force.", exp: "En rassemblant nos efforts, nous sommes bien plus puissants que seuls.", theme: "Entraide" }
    ];

    function getProverbOfDay() {
      const today = new Date();
      const start = new Date(today.getFullYear(), 0, 0);
      const diff = today - start;
      const oneDay = 1000 * 60 * 60 * 24;
      const dayOfYear = Math.floor(diff / oneDay);
      return proverbs[dayOfYear % proverbs.length];
    }

    function displayProverb(item) {
      document.getElementById('proverb-text').textContent = `« ${item.text} »`;
      document.getElementById('explanation-text').textContent = item.exp;
      document.getElementById('theme-badge').textContent = item.theme;

      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('date-text').textContent = new Date().toLocaleDateString('fr-FR', options);
    }

    function randomProverb() {
      const randomIndex = Math.floor(Math.random() * proverbs.length);
      displayProverb(proverbs[randomIndex]);
    }

    function shareProverb() {
      const text = document.getElementById('proverb-text').textContent;
      if (navigator.share) {
        navigator.share({
          title: 'Proverbe du jour',
          text: text,
          url: window.location.href
        });
      } else {
        navigator.clipboard.writeText(text);
        alert('Proverbe copié dans le presse-papier !');
      }
    }

    // Initialisation
    displayProverb(getProverbOfDay());
    lucide.createIcons();
  </script>
</body>
</html>
