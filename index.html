</head>

        let currentProverb = null;

        function getProverbOfDay() {
            const today = new Date();
            const start = new Date(today.getFullYear(), 0, 0);
            const diff = today - start;
            const oneDay = 1000 * 60 * 60 * 24;
            const dayOfYear = Math.floor(diff / oneDay);
            return proverbs[dayOfYear % proverbs.length];
        }

        function displayProverb(p) {
            currentProverb = p;
            document.getElementById('proverb').textContent = "« " + p.text + " »";
            document.getElementById('explanation').textContent = p.exp;
            document.getElementById('thought').textContent = p.thought;
            document.getElementById('theme').textContent = p.theme || "Sagesse";
            
            const options = { weekday: 'long', day: 'numeric', month: 'long' };
            document.getElementById('date').textContent = new Date().toLocaleDateString('fr-FR', options);
        }

        function getRandomProverb() {
            const randomIndex = Math.floor(Math.random() * proverbs.length);
            displayProverb(proverbs[randomIndex]);
            closeSearch();
        }

        function speakProverb() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const textToSpeak = currentProverb.text + ". " + currentProverb.exp + " Pensée positive : " + currentProverb.thought;
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = 'fr-FR';
                window.speechSynthesis.speak(utterance);
                showToast("🔊 Lecture en cours...");
            } else {
                showToast("La synthèse vocale n'est pas supportée.");
            }
        }

        function shareProverb() {
            const textToShare = "« " + currentProverb.text + " »\n\nExplication : " + currentProverb.exp + "\n\nPensée positive : " + currentProverb.thought;
            if (navigator.share) {
                navigator.share({ title: 'Proverbe du Jour', text: textToShare, url: window.location.href });
            } else {
                navigator.clipboard.writeText(textToShare);
                showToast("Copie effectuée dans le presse-papier !");
            }
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const resultsContainer = document.getElementById('searchResults');
            
            if (query.length < 1) {
                resultsContainer.classList.remove('active');
                resultsContainer.innerHTML = '';
                return;
            }

            const matches = proverbs.filter(p => 
                p.text.toLowerCase().includes(query) || 
                p.exp.toLowerCase().includes(query) || 
                p.thought.toLowerCase().includes(query) ||
                p.theme.toLowerCase().includes(query)
            );

            if (matches.length === 0) {
                resultsContainer.innerHTML = '<div class="search-item" style="color:var(--text-dim); text-align:center;">Aucun proverbe trouvé</div>';
            } else {
                resultsContainer.innerHTML = matches.map(p => `
                    <div class="search-item" onclick="selectProverb(${p.id})">
                        <div class="search-item-theme">${p.theme}</div>
                        <div class="search-item-title">« ${p.text} »</div>
                    </div>
                `).join('');
            }

            resultsContainer.classList.add('active');
        }

        function selectProverb(id) {
            const found = proverbs.find(p => p.id === id);
            if (found) {
                displayProverb(found);
                closeSearch();
            }
        }

        function closeSearch() {
            document.getElementById('searchInput').value = '';
            const resultsContainer = document.getElementById('searchResults');
            resultsContainer.classList.remove('active');
            resultsContainer.innerHTML = '';
        }

        // Close search list if user clicks outside
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.search-container')) {
                closeSearch();
            }
        });

        function downloadAsImage() {
            showToast("📸 Génération de la carte image...");
            const cardElement = document.getElementById('proverbCard');
            
            // Hide action buttons temporarily during capture
            const btnGrid = cardElement.querySelector('.btn-grid');
            btnGrid.style.display = 'none';

            html2canvas(cardElement, {
                backgroundColor: '#0f172a',
                scale: 2, // High resolution output
                useCORS: true,
                logging: false,
                borderRadius: 20
            }).then(canvas => {
                // Restore buttons
                btnGrid.style.display = 'grid';

                // Trigger PNG download
                const link = document.createElement('a');
                const cleanName = currentProverb.text.substring(0, 15).replace(/[^a-zA-Z0-9]/g, "_");
                link.download = `Proverbe_${cleanName}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                showToast("✨ Image téléchargée !");
            }).catch(err => {
                btnGrid.style.display = 'grid';
                showToast("Erreur lors de la génération de l'image");
                console.error(err);
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        window.onload = function() {
            displayProverb(getProverbOfDay());
        };
    </script>
