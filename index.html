<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Proverbe du Jour</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2canvas for downloading card as PNG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.75);
            --gold-primary: #f59e0b;
            --gold-glow: rgba(245, 158, 11, 0.3);
            --emerald-accent: #34d399;
            --emerald-glow: rgba(52, 211, 153, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glass: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(245, 158, 11, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(52, 211, 153, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-icon {
            font-size: 2.5rem;
            color: var(--gold-primary);
            margin-bottom: 8px;
            filter: drop-shadow(0 0 10px var(--gold-glow));
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: var(--gold-primary);
            font-size: 2.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 4px;
            font-weight: 300;
        }

        /* Search Section */
        .search-container {
            position: relative;
            margin-bottom: 20px;
        }

        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .search-input {
            width: 100%;
            padding: 14px 16px 14px 45px;
            border-radius: 14px;
            border: 1px solid var(--border-glass);
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(8px);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 15px var(--gold-glow);
            background: rgba(30, 41, 59, 0.95);
        }

        .search-results {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: #1e293b;
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 14px;
            max-height: 240px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            display: none;
        }

        .search-item {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            font-size: 0.88rem;
            transition: background 0.2s;
            text-align: left;
        }

        .search-item:last-child {
            border-bottom: none;
        }

        .search-item:hover {
            background: rgba(245, 158, 11, 0.15);
            color: var(--gold-primary);
        }

        .search-item-theme {
            display: inline-block;
            font-size: 0.75rem;
            color: var(--emerald-accent);
            margin-right: 6px;
            font-weight: 600;
        }

        /* Card Component */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--gold-primary), var(--emerald-accent));
        }

        .badge-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .date-badge {
            background: rgba(245, 158, 11, 0.12);
            color: var(--gold-primary);
            border: 1px solid rgba(245, 158, 11, 0.25);
        }

        .theme-badge {
            background: rgba(52, 211, 153, 0.12);
            color: var(--emerald-accent);
            border: 1px solid rgba(52, 211, 153, 0.25);
        }

        .proverb-quote {
            font-family: 'Cinzel', serif;
            font-size: 1.45rem;
            line-height: 1.6;
            margin-bottom: 24px;
            color: #ffffff;
            font-weight: 700;
            position: relative;
            padding: 0 10px;
        }

        .info-box {
            font-size: 0.92rem;
            color: var(--text-muted);
            line-height: 1.6;
            background: rgba(15, 23, 42, 0.6);
            padding: 16px;
            border-radius: 14px;
            text-align: left;
            margin-bottom: 14px;
            border-left: 4px solid transparent;
        }

        .explanation {
            border-left-color: var(--gold-primary);
        }

        .positive-thought {
            border-left-color: var(--emerald-accent);
            margin-bottom: 26px;
        }

        .info-box strong {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .explanation strong { color: var(--gold-primary); }
        .positive-thought strong { color: var(--emerald-accent); }

        .info-box span {
            color: #e2e8f0;
        }

        /* Interactive Buttons */
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 16px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 1px solid var(--border-glass);
            outline: none;
        }

        .btn:hover {
            background: var(--gold-primary);
            color: #0f172a;
            border-color: var(--gold-primary);
            box-shadow: 0 4px 15px var(--gold-glow);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-full {
            grid-column: span 2;
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e293b;
            color: var(--gold-primary);
            border: 1px solid var(--gold-primary);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        footer {
            text-align: center;
            margin-top: 24px;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.8rem; }
            .proverb-quote { font-size: 1.25rem; }
            .card { padding: 24px 18px; }
            .btn { font-size: 0.82rem; padding: 10px 12px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-icon"><i class="fa-solid fa-book-open-reader"></i></div>
            <h1>Le Proverbe du Jour</h1>
            <p class="subtitle">Sagesse, inspiration & pensées quotidiennes</p>
        </header>

        <!-- Search Bar -->
        <div class="search-container">
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Rechercher par mot-clé ou thème..." onkeyup="searchProverb()">
            </div>
            <div id="searchResults" class="search-results"></div>
        </div>

        <!-- Main Proverb Card -->
        <div class="card" id="cardToCapture">
            <div class="badge-group">
                <span class="badge date-badge"><i class="fa-regular fa-calendar"></i> <span id="date">--</span></span>
                <span class="badge theme-badge"><i class="fa-solid fa-tag"></i> <span id="theme">--</span></span>
            </div>
            
            <div class="proverb-quote" id="proverb">Chargement...</div>
            
            <div class="info-box explanation">
                <strong><i class="fa-solid fa-lightbulb"></i> Explication</strong>
                <span id="explanation">...</span>
            </div>

            <div class="info-box positive-thought">
                <strong><i class="fa-solid fa-seedling"></i> Pensée Positive</strong>
                <span id="thought">...</span>
            </div>

            <div class="btn-grid">
                <button class="btn" onclick="speakProverb()"><i class="fa-solid fa-volume-high"></i> Écouter</button>
                <button class="btn" onclick="shareProverb()"><i class="fa-solid fa-share-nodes"></i> Partager</button>
                <button class="btn" onclick="downloadImage()"><i class="fa-solid fa-image"></i> Télécharger image</button>
                <button class="btn" onclick="getRandomProverb()"><i class="fa-solid fa-dice"></i> Un autre</button>
            </div>
        </div>

        <footer>
            © Le Proverbe du Jour • Sagesse populaire & Méditation
        </footer>
    </div>

    <div id="toast" class="toast"><i class="fa-solid fa-circle-check"></i> <span id="toastMsg">Action effectuée !</span></div>

    <script>
        // Database of Proverbs
        const proverbs = [
            { id: 1, theme: "Apparence", text: "L'habit ne fait pas le moine.", exp: "Il ne faut pas juger une personne sur son apparence extérieure.", thought: "Aujourd'hui, je prends le temps de découvrir la richesse intérieure des gens qui m'entourent." },
            { id: 2, theme: "Patience", text: "Qui va lentement arrive sûrement.", exp: "Prendre son temps garantit de mieux réussir ses entreprises.", thought: "Je respire et j'avance à mon propre rythme. Chaque petit pas me rapproche de mon objectif." },
            { id: 3, theme: "Espoir", text: "Après la pluie, le beau temps.", exp: "Les difficultés finissent toujours par laisser place à des jours meilleurs.", thought: "Peu importe les nuages d'aujourd'hui, le soleil finit toujours par briller à nouveau." },
            { id: 4, theme: "Constance", text: "Pierre qui roule n'amasse pas mousse.", exp: "Changer trop souvent d'occupation ne permet pas de construire quelque chose de durable.", thought: "Je choisis un objectif important aujourd'hui et j'y consacre toute mon attention." },
            { id: 5, theme: "Authenticité", text: "Chassez le naturel, il revient au galop.", exp: "On ne peut pas masquer sa vraie nature bien longtemps.", thought: "J'embrasse pleinement qui je suis aujourd'hui sans chercher à jouer un rôle." },
            { id: 6, theme: "Préparation", text: "Rien ne sert de courir, il faut partir à point.", exp: "La précipitation est inutile, la préparation compte davantage.", thought: "Je prends un moment pour planifier ma journée dans le calme et la sérénité." },
            { id: 7, theme: "Persévérance", text: "Petit à petit, l'oiseau fait son nid.", exp: "C'est avec de la persévérance que l'on accomplit de grandes choses.", thought: "Je célèbre chaque petite victoire quotidienne, elles construisent mes grands succès." },
            { id: 8, theme: "Volonté", text: "Vouloir, c'est pouvoir.", exp: "La volonté permet de surmonter la plupart des obstacles.", thought: "J'ai en moi toute la force et la détermination nécessaires pour concrétiser mes rêves." },
            { id: 9, theme: "Talent", text: "Aux âmes bien nées, la valeur n'attend point le nombre des années.", exp: "Le talent ne dépend pas de l'âge.", thought: "Mon potentiel est immense, quel que soit mon âge ou mon expérience passée." },
            { id: 10, theme: "Courage", text: "À cœur vaillant rien d'impossible.", exp: "Avec du courage, on peut réussir n'importe quel défi.", thought: "J'aborde ce jour avec un cœur courageux et ouvert à toutes les belles possibilités." },
            { id: 11, theme: "Actions", text: "Qui sème le vent récolte la tempête.", exp: "Provoquer des désordres finit par se retourner contre soi.", thought: "Aujourd'hui, je sème la bienveillance et l'écoute autour de moi." },
            { id: 12, theme: "Sagesse", text: "L'erreur est humaine, persévérer est diabolique.", exp: "Chacun peut se tromper, mais refuser de corriger ses fautes est une faute.", thought: "J'accepte mes erreurs comme des leçons précieuses qui me font grandir." },
            { id: 13, theme: "Optimisme", text: "Mieux vaut tard que jamais.", exp: "Il vaut mieux accomplir une action tardivement que de ne jamais la faire.", thought: "Il n'est jamais trop tard pour commencer un beau projet ou prendre soin de soi." },
            { id: 14, theme: "Entraide", text: "L'union fait la force.", exp: "En rassemblant nos efforts, nous sommes bien plus puissants.", thought: "Je cherche aujourd'hui à collaborer et à partager un moment chaleureux avec autrui." },
            { id: 15, theme: "Opportunité", text: "Il faut battre le fer tant qu'il est chaud.", exp: "Il faut saisir les opportunités dès qu'elles se présentent.", thought: "Je suis attentif aux opportunités d'aujourd'hui et j'agis avec enthousiasme." },
            { id: 16, theme: "Sérénité", text: "Tout vient à point à qui sait attendre.", exp: "Avec de la patience, on obtient ce que l'on désire.", thought: "Je fais confiance au cours de la vie et j'accueille chaque moment avec paix." },
            { id: 17, theme: "Prudence", text: "Prudence est mère de sûreté.", exp: "En faisant attention, on évite bien des désagréments.", thought: "Je prends soin de moi et de mes proches avec attention et douceur." },
            { id: 18, theme: "Santé", text: "Mieux vaut prévenir que guérir.", exp: "Il est préférable d'anticiper les problèmes.", thought: "Je prends soin de ma santé physique et mentale dès aujourd'hui." },
            { id: 19, theme: "Pratique", text: "C'est en forgeant qu'on devient forgeron.", exp: "La pratique régulière permet de maîtriser un savoir-faire.", thought: "Chaque entraînement développe mes talents et ma confiance en moi." },
            { id: 20, theme: "Présent", text: "À chaque jour suffit sa peine.", exp: "Il ne sert à rien de s'inquiéter à l'avance pour demain.", thought: "Aujourd'hui est un jour nouveau, plein de fraîcheur et d'opportunités." },
            { id: 21, theme: "Résilience", text: "Ce qui ne tue pas rend plus fort.", exp: "Les épreuves surmontées nous renforcent.", thought: "Chaque défi surmonté révèle ma résistance extraordinaire." },
            { id: 22, theme: "Écoute", text: "Il n'est pire sourd que celui qui ne veut pas entendre.", exp: "Il est difficile de convaincre quelqu'un qui refuse d'écouter.", thought: "J'offre une écoute sincère et attentive aux personnes que je croise." },
            { id: 23, theme: "Focus", text: "Qui trop embrasse mal étreint.", exp: "Vouloir mener trop de projets empêche de les réussir.", thought: "Je me concentre sur ce qui compte vraiment et j'y prends du plaisir." },
            { id: 24, theme: "Audace", text: "Il n'y a que le premier pas qui coûte.", exp: "Le plus difficile dans un projet est de commencer.", thought: "Je me lance aujourd'hui avec confiance, le chemin se révélera pas à pas." },
            { id: 25, theme: "Souplesse", text: "Mieux vaut plier que rompre.", exp: "Savoir s'adapter permet de traverser les crises.", thought: "Ma souplesse d'esprit est ma plus grande protection face aux imprévus." }
        ];

        let currentProverb = null;

        // Get daily proverb based on calendar date
        function getProverbOfDay() {
            const today = new Date();
            const start = new Date(today.getFullYear(), 0, 0);
            const diff = today - start;
            const oneDay = 1000 * 60 * 60 * 24;
            const dayOfYear = Math.floor(diff / oneDay);
            return proverbs[dayOfYear % proverbs.length];
        }

        // Render Proverb to Card
        function displayProverb(p) {
            currentProverb = p;
            document.getElementById('proverb').textContent = "« " + p.text + " »";
            document.getElementById('explanation').textContent = p.exp;
            document.getElementById('thought').textContent = p.thought;
            document.getElementById('theme').textContent = p.theme;
            
            const options = { weekday: 'long', day: 'numeric', month: 'long' };
            const todayFormatted = new Date().toLocaleDateString('fr-FR', options);
            document.getElementById('date').textContent = todayFormatted.charAt(0).toUpperCase() + todayFormatted.slice(1);
        }

        // Random Proverb Action
        function getRandomProverb() {
            const randomIndex = Math.floor(Math.random() * proverbs.length);
            displayProverb(proverbs[randomIndex]);
            showToast("Nouveau proverbe tiré !");
        }

        // Text to Speech
        function speakProverb() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const textToSpeak = `${currentProverb.text}. Explication : ${currentProverb.exp}. Pensée positive : ${currentProverb.thought}`;
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.95;
                window.speechSynthesis.speak(utterance);
                showToast("Lecture vocale démarrée...");
            } else {
                showToast("Synthèse vocale non disponible.");
            }
        }

        // Share functionality
        function shareProverb() {
            const textToShare = `« ${currentProverb.text} »\n\n💡 Explication : ${currentProverb.exp}\n🌱 Pensée positive : ${currentProverb.thought}`;
            
            if (navigator.share) {
                navigator.share({
                    title: 'Le Proverbe du Jour',
                    text: textToShare,
                    url: window.location.href
                }).catch(() => {});
            } else {
                // Clipboard fallback
                const dummy = document.createElement("textarea");
                document.body.appendChild(dummy);
                dummy.value = textToShare;
                dummy.select();
                document.execCommand("copy");
                document.body.removeChild(dummy);
                showToast("Proverbe copié dans le presse-papier !");
            }
        }

        // Download Card as PNG Image
        function downloadImage() {
            showToast("Génération de l'image...");
            const card = document.getElementById('cardToCapture');
            
            html2canvas(card, {
                backgroundColor: '#0f172a',
                scale: 2,
                useCORS: true,
                logging: false
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `proverbe-${currentProverb.theme.toLowerCase()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                showToast("Image téléchargée !");
            }).catch(err => {
                showToast("Erreur lors de la création de l'image");
                console.error(err);
            });
        }

        // Search Proverb Engine
        function searchProverb() {
            const input = document.getElementById('searchInput').value.toLowerCase().trim();
            const resultsContainer = document.getElementById('searchResults');
            resultsContainer.innerHTML = '';

            if (input === '') {
                resultsContainer.style.display = 'none';
                return;
            }

            const filtered = proverbs.filter(p => 
                p.text.toLowerCase().includes(input) || 
                p.exp.toLowerCase().includes(input) || 
                p.theme.toLowerCase().includes(input)
            );

            if (filtered.length === 0) {
                const emptyItem = document.createElement('div');
                emptyItem.className = 'search-item';
                emptyItem.style.color = 'var(--text-muted)';
                emptyItem.textContent = 'Aucun proverbe trouvé.';
                resultsContainer.appendChild(emptyItem);
            } else {
                filtered.slice(0, 6).forEach(p => {
                    const item = document.createElement('div');
                    item.className = 'search-item';
                    item.innerHTML = `<span class="search-item-theme">[${p.theme}]</span> ${p.text}`;
                    item.onclick = () => {
                        displayProverb(p);
                        resultsContainer.style.display = 'none';
                        document.getElementById('searchInput').value = '';
                        showToast("Proverbe affiché !");
                    };
                    resultsContainer.appendChild(item);
                });
            }

            resultsContainer.style.display = 'block';
        }

        // Notification Toast
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Close search results when clicking outside
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.search-container')) {
                document.getElementById('searchResults').style.display = 'none';
            }
        });

        // Initialize on Load
        window.onload = function() {
            displayProverb(getProverbOfDay());
        };
    </script>
</body>
</html>
