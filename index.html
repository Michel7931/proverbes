<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Proverbe du Jour</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-gold: #f59e0b;
            --text-light: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: var(--accent-gold);
            font-size: 2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 20px;
            padding: 30px 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
        }

        .date-badge {
            display: inline-block;
            background: rgba(245, 158, 11, 0.1);
            color: var(--accent-gold);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .proverb-text {
            font-family: 'Cinzel', serif;
            font-size: 1.35rem;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .explanation {
            font-size: 0.9rem;
            color: var(--text-dim);
            line-height: 1.5;
            background: rgba(15, 23, 42, 0.5);
            padding: 15px;
            border-radius: 12px;
            border-left: 3px solid var(--accent-gold);
            text-align: left;
            margin-bottom: 24px;
        }

        .explanation strong {
            color: var(--accent-gold);
            display: block;
            margin-bottom: 4px;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-light);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        button:hover {
            background: var(--accent-gold);
            color: #000;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            color: var(--text-dim);
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Le Proverbe du Jour</h1>
            <p class="subtitle">Sagesse & Pensées au quotidien</p>
        </header>

        <div class="card">
            <span class="date-badge" id="date">--</span>
            <div class="proverb-text" id="proverb">Chargement...</div>
            <div class="explanation">
                <strong>Explication</strong>
                <span id="explanation">...</span>
            </div>

            <div class="btn-group">
                <button onclick="speakProverb()">🔊 Écouter</button>
                <button onclick="shareProverb()">📲 Partager</button>
                <button onclick="getRandomProverb()">🎲 Un autre</button>
            </div>
        </div>

        <footer>
            Proverbe du Jour • 100 Proverbes en Stock
        </footer>
    </div>

            { id: 59, text: "Chacun voit midi à sa porte.", exp: "Chacun juge une situation selon son propre point de vue." },

            { id: 61, text: "Il faut rendre à César ce qui est à César.", exp: "Il faut attribuer à chacun le mérite qui lui revient." },

            { id: 63, text: "Les absents ont toujours tort.", exp: "Ceux qui ne sont pas là ne peuvent pas se défendre." },

        let currentProverb = null;

        function getProverbOfDay() {
            const today = new Date();
            const start = new Date(today.getFullYear(), 0, 0);
            const diff = today - start;
            const oneDay = 1000 * 60 * 60 * 24;
            const dayOfYear = Math.floor(diff / oneDay);
            return proverbs[dayOfYear % proverbs.length];
        }

        function displayProverb(p) {
            currentProverb = p;
            document.getElementById('proverb').textContent = "« " + p.text + " »";
            document.getElementById('explanation').textContent = p.exp;
            
            const options = { weekday: 'long', day: 'numeric', month: 'long' };
            document.getElementById('date').textContent = new Date().toLocaleDateString('fr-FR', options);
        }

        function getRandomProverb() {
            const randomIndex = Math.floor(Math.random() * proverbs.length);
            displayProverb(proverbs[randomIndex]);
        }

        function speakProverb() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(currentProverb.text + ". " + currentProverb.exp);
                utterance.lang = 'fr-FR';
                window.speechSynthesis.speak(utterance);
            } else {
                alert('La synthèse vocale n\'est pas supportée sur cet appareil.');
            }
        }

        function shareProverb() {
            const textToShare = "« " + currentProverb.text + " » - " + currentProverb.exp;
            if (navigator.share) {
                navigator.share({ title: 'Proverbe du Jour', text: textToShare, url: window.location.href });
            } else {
                navigator.clipboard.writeText(textToShare);
                alert('Proverbe copié dans votre presse-papier !');
            }
        }

        window.onload = function() {
            displayProverb(getProverbOfDay());
        };

</body>
</html>
